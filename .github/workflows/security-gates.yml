# Gates de segurança do siked (ADR-0007). Cada job é um gate: se falhar, o pipeline fica vermelho.
# Ferramentas instaladas em versão fixa, com checksum SHA-256 conferido, e fora do workspace
# (assim o scanner não analisa os próprios binários).

name: Security gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.21.2
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
  HADOLINT_VERSION: 2.12.0
  HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
  SEMGREP_VERSION: 1.182.1
  CHECKOV_VERSION: 3.3.30

jobs:
  secrets:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks

      - name: Varrer o histórico inteiro do git
        run: '"$RUNNER_TEMP/gitleaks" git . --config security/gitleaks/gitleaks.toml --redact --verbose'

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Regras OWASP + JavaScript/TypeScript + Node + regras próprias
        run: >-
          semgrep scan --error --metrics=off
          --config p/owasp-top-ten
          --config p/javascript
          --config p/typescript
          --config p/nodejsscan
          --config security/semgrep

  dependencies:
    name: Dependências (Trivy fs)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Trivy
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy

      - name: CVEs HIGH/CRITICAL com correção disponível
        run: '"$RUNNER_TEMP/trivy" fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress .'

  npm-audit:
    name: npm audit (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [shared, app, deception, detection, ingest, traffic-generator, dashboard, dashboard/ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Dependências de produção sem vulnerabilidade high/critical
        working-directory: ${{ matrix.service }}
        run: npm audit --omit=dev --audit-level=high

  dockerfiles:
    name: Dockerfiles (Hadolint + Checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Hadolint
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint

      - name: Hadolint
        run: git ls-files -z '*Dockerfile' | xargs -0 "$RUNNER_TEMP/hadolint" --config security/hadolint/hadolint.yaml

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar Checkov
        run: pip install "checkov==${CHECKOV_VERSION}"

      - name: Checkov (Dockerfiles e workflows do GitHub Actions)
        run: checkov --config-file security/checkov/config.yaml

  container-images:
    name: Imagem (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: app, context: app, dockerfile: app/Dockerfile }
          - { service: deception, context: deception, dockerfile: deception/Dockerfile }
          - { service: ingest, context: ., dockerfile: ingest/Dockerfile }
          - { service: detection, context: ., dockerfile: detection/Dockerfile }
          - { service: dashboard, context: dashboard, dockerfile: dashboard/Dockerfile }
          - { service: traffic-generator, context: traffic-generator, dockerfile: traffic-generator/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Trivy
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy

      - name: Build da imagem
        env:
          SERVICE: ${{ matrix.service }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --pull -t "siked-${SERVICE}:ci" -f "$DOCKERFILE" "$CONTEXT"

      - name: CVEs HIGH/CRITICAL com correção disponível na imagem
        env:
          SERVICE: ${{ matrix.service }}
        run: '"$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "siked-${SERVICE}:ci"'
